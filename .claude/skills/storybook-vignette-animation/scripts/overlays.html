<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Tinos";src:url(../assets/fonts/tinos-latin-400-normal.woff2)}
@font-face{font-family:"Patrick Hand";src:url(../assets/fonts/patrick-hand-latin-400-normal.woff2)}
@font-face{font-family:"Courier Prime";font-weight:700;src:url(../assets/fonts/courier-prime-latin-700-normal.woff2)}
</style></head><body><script>
// Renders the fixed POV caption, the speech bubbles and the end-card title as transparent PNGs (THEME.md section 6).
window.make = async (ep) => {
  await Promise.all([document.fonts.load('44px "Tinos"'), document.fonts.load('40px "Patrick Hand"'), document.fonts.load('bold 84px "Courier Prime"')]);
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
  const out = {};
  let [c, g] = mk(1080, 1920); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#000'; g.fillRect(481, 324, 118, 89); g.fillStyle = '#fff'; g.font = '44px "Tinos"'; g.fillText('POV', 540, 370);
  g.font = '40px "Tinos"'; const L = ep.caption_lines;
  const w = Math.max(...L.map(l => g.measureText(l).width)) + 44, h = 48 + 50 * L.length;
  g.fillStyle = '#000'; g.fillRect(540 - w / 2, 424, w, h); g.fillStyle = '#fff'; L.forEach((l, i) => g.fillText(l, 540, 470 + i * 50));
  out.caption = c.toDataURL();
  (ep.bubbles || []).forEach((b, i) => {
    const [bc, x] = mk(700, 140); x.font = '40px "Patrick Hand"'; const bw = x.measureText(b.text).width + 52, bh = 68, bx = (700 - bw) / 2, by = 20;
    x.beginPath(); x.roundRect(bx, by, bw, bh, 34); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#2a2018'; x.stroke();
    const tx = b.tail === 'right' ? bx + bw * 0.78 : bx + bw * 0.22; x.beginPath(); x.moveTo(tx, by + bh - 2); x.lineTo(tx + (b.tail === 'right' ? 6 : -6), by + bh + 30); x.stroke();
    x.fillStyle = '#2a2018'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(b.text, 350, by + bh / 2 + 2); out['bubble' + i] = bc.toDataURL();
  });
  [c, g] = mk(1080, 1920); g.textAlign = 'center'; g.fillStyle = '#7A3E1E'; g.shadowColor = 'rgba(245,150,70,0.85)'; g.shadowBlur = 28;
  g.font = 'bold 84px "Courier Prime"'; const T = ep.end_card.title_lines || ['forgotten', 'little joys of life'];
  T.forEach((l, i) => g.fillText(l, 540, 930 + i * 100));
  if (ep.end_card.episode_label) { g.font = 'bold 46px "Courier Prime"'; g.fillText(ep.end_card.episode_label, 540, 930 + T.length * 100 - 10); }
  out.title = c.toDataURL();
  return out;
};
</script></body></html>
